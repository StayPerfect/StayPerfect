name: Deploy StayPerfect to Cloudflare

on:
  push:
    branches:
      - gh-pages-new

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.135.0 deploy --name stayperfect --compatibility-date 2026-09-07 --assets .

      - name: Show Wrangler diagnostics
        if: always()
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          WRANGLER_ERROR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          echo "=== WRANGLER OUTPUT ==="
          echo "$WRANGLER_OUTPUT"
          echo "=== WRANGLER STDERR ==="
          echo "$WRANGLER_ERROR"
