name: Deploy StayPerfect to Cloudflare

on:
  push:
    branches:
      - gh-pages-new

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name stayperfect --compatibility-date 2026-09-07 --assets .

      - name: Show Wrangler diagnostics
        if: always()
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          WRANGLER_ERROR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          echo "=== WRANGLER OUTPUT ==="
          echo "$WRANGLER_OUTPUT"
          echo "=== WRANGLER STDERR ==="
          echo "$WRANGLER_ERROR"
